name: E2E Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Ensure E2E_BASE_URL is set
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "E2E_BASE_URL=https://inquisitive-parfait-8b7a79.netlify.app" >> $GITHUB_ENV
            echo "Using default public deploy URL for E2E (set secret E2E_BASE_URL to override)"
          else
            echo "E2E_BASE_URL=$E2E_BASE_URL" >> $GITHUB_ENV
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
